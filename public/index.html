<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Ad Publisher - Multi-Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center p-4">

    <div class="w-full max-w-7xl grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <!-- Left Sidebar Controls -->
        <div class="md:col-span-5 bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
            
            <!-- Real Dynamic User Profile Box -->
            <div id="profile-box" class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg border border-slate-100">
                <img id="user-avatar" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full object-cover border" alt="Avatar">
                <div>
                    <h4 id="user-name" class="font-semibold text-sm text-slate-700">Detecting account...</h4>
                    <p id="user-id" class="text-xs text-slate-400">---</p>
                </div>
            </div>

            <!-- Facebook Pages -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Facebook Pages</label>
                <select id="page-select" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">Fetching pages...</option>
                </select>
            </div>

            <!-- Ad Accounts -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Ad Accounts</label>
                <select id="adaccount-select" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">Fetching ad accounts...</option>
                </select>
            </div>

            <!-- Primary Text -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Primary text</label>
                <textarea id="primary-text" rows="3" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="What's on your mind?"></textarea>
            </div>

            <!-- Upload Image -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Upload Image</label>
                <input type="file" id="image-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-lg p-1">
            </div>

            <!-- Card Buttons -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Card Buttons</label>
                <select id="cta-type" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="No Button">No Button</option>
                    <option value="Like Page">Like Page</option>
                    <option value="Learn More" selected>Learn More</option>
                    <option value="Shop Now">Shop Now</option>
                    <option value="Join Group">Join Group</option>
                    <option value="Book Travel">Book Travel</option>
                    <option value="Contact Us">Contact Us</option>
                </select>
            </div>

            <!-- Card 1 title (Headline) -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Card 1 title</label>
                <input type="text" id="card-title" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Write a short headline">
            </div>

            <!-- Website Url -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Website Url</label>
                <input type="text" id="website-url" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://www.example.com/page">
            </div>

            <!-- Show display link -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Show display link (Basic +)</label>
                <input type="text" id="display-link" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="facebook.com">
            </div>

            <!-- Description -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Put display link description (Basic +)</label>
                <input type="text" id="display-desc" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Description">
            </div>

        </div>

        <!-- Right Full-View Preview & Publish Area -->
        <div class="md:col-span-7 space-y-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between h-full min-h-[650px]">
                
                <!-- Preview Header & Publish Button -->
                <div class="flex items-center justify-between border-b pb-4">
                    <div class="flex items-center space-x-3">
                        <img id="preview-avatar" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full object-cover border" alt="Page Avatar">
                        <div>
                            <h5 id="preview-page-name" class="font-semibold text-sm text-slate-900">Select Page</h5>
                            <span id="preview-page-id" class="text-xs text-slate-400">ID: ---</span>
                        </div>
                    </div>
                    <button id="publish-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-8 py-2.5 rounded-lg text-sm shadow transition tracking-wide">PUBLISH</button>
                </div>

                <!-- Full-View Ad Creative Preview Box -->
                <div class="border-2 border-blue-400 rounded-xl overflow-hidden my-auto bg-white flex flex-col shadow-sm">
                    <div id="preview-image-container" class="w-full bg-slate-100 flex items-center justify-center text-slate-400 text-sm overflow-hidden relative min-h-[350px] max-h-[450px]">
                        <span id="preview-image-placeholder" class="py-20">Ad Creative Preview Area</span>
                        <img id="preview-img" class="w-full h-full object-cover hidden" alt="Full Preview">
                    </div>
                    <div class="p-4 bg-white border-t flex items-center justify-between">
                        <div>
                            <span id="preview-display-link" class="text-xs text-slate-400 block uppercase tracking-wider">facebook.com</span>
                            <h4 id="preview-headline" class="font-bold text-base text-slate-900">Headline preview</h4>
                        </div>
                        <button id="preview-cta-btn" class="bg-slate-100 border border-slate-200 text-slate-800 px-5 py-2 rounded-lg text-xs font-semibold shadow-sm hover:bg-slate-200">Learn More</button>
                    </div>
                </div>

                <!-- Status Feedback Bar -->
                <div id="status-bar" class="hidden p-3 rounded-lg text-xs font-medium text-center"></div>

            </div>
        </div>

    </div>

    <!-- Extension Synced Data Helper -->
    <div class="w-full max-w-7xl mt-6 p-4 bg-white rounded-xl border border-slate-200 text-xs text-slate-500">
        <details open>
            <summary class="cursor-pointer font-semibold text-slate-600 flex justify-between items-center">
                <span>Extension Synced Data (Multi-Account)</span>
                <button id="refresh-account-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-bold transition">Detect Current Account</button>
            </summary>
            <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium mb-1">Access Token:</label>
                    <input type="text" id="sync-token" class="w-full p-2 border rounded bg-slate-50" placeholder="Paste active access token here">
                </div>
                <div>
                    <label class="block font-medium mb-1">Cookie Data (c_user=...):</label>
                    <input type="text" id="sync-cookie" class="w-full p-2 border rounded bg-slate-50" placeholder="c_user=YOUR_ACTIVE_ID;">
                </div>
            </div>
        </details>
    </div>

    <script>
        async function fetchRealUserData() {
            const token = document.getElementById('sync-token').value.trim();
            const cookie = document.getElementById('sync-cookie').value.trim();
            
            if (!token) {
                document.getElementById('user-name').innerText = 'Please enter Access Token';
                return;
            }

            document.getElementById('user-name').innerText = 'Detecting active profile...';

            try {
                const res = await fetch('/api/facebook-accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessToken: token, cookieData: cookie })
                });
                const data = await res.json();

                if (data.success) {
                    if (data.user) {
                        document.getElementById('user-name').innerText = data.user.name || 'Active Account';
                        document.getElementById('user-id').innerText = data.user.id || 'Connected ID';
                        if (data.user.picture?.data?.url) {
                            document.getElementById('user-avatar').src = data.user.picture.data.url;
                        } else {
                            document.getElementById('user-avatar').src = 'https://via.placeholder.com/40';
                        }
                    }

                    // Populate Pages
                    const pageSelect = document.getElementById('page-select');
                    pageSelect.innerHTML = '';
                    if (data.pages && data.pages.length > 0) {
                        data.pages.forEach((p, index) => {
                            const opt = document.createElement('option');
                            opt.value = p.id;
                            opt.textContent = `${p.name} (${p.id})`;
                            pageSelect.appendChild(opt);
                            if (index === 0) {
                                document.getElementById('preview-page-name').innerText = p.name;
                                document.getElementById('preview-page-id').innerText = p.id;
                            }
                        });
                    } else {
                        pageSelect.innerHTML = `<option value="">No pages found</option>`;
                    }

                    // Populate Ad Accounts or allow manual fallback
                    const adSelect = document.getElementById('adaccount-select');
                    adSelect.innerHTML = '';
                    if (data.adAccounts && data.adAccounts.length > 0) {
                        data.adAccounts.forEach(a => {
                            const opt = document.createElement('option');
                            opt.value = a.account_id;
                            opt.textContent = `${a.name || 'Ad Account'} (${a.account_id})`;
                            adSelect.appendChild(opt);
                        });
                    } else {
                        const opt = document.createElement('option');
                        opt.value = 'default';
                        opt.textContent = 'Default Ad Account';
                        adSelect.appendChild(opt);
                    }
                }
            } catch (err) {
                console.error('Detection error:', err);
            }
        }

        
        // AUTO DETECT TOKEN FROM EXTENSION
        const tokenInput=document.getElementById('sync-token');
        const cookieInput=document.getElementById('sync-cookie');
        let autoLoaded=false;
        function tryAutoLoad(){
            const t=tokenInput.value.trim();
            if(t && !autoLoaded){
                autoLoaded=true;
                fetchRealUserData();
            }
        }
        tokenInput.addEventListener('input',()=>{autoLoaded=false;tryAutoLoad();});
        cookieInput.addEventListener('input',()=>{autoLoaded=false;tryAutoLoad();});
        setInterval(tryAutoLoad,1000);

document.getElementById('refresh-account-btn').addEventListener('click', (e) => {
            e.preventDefault();
            fetchRealUserData();
        });

        // Image Full-View Preview Handler
        document.getElementById('image-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('preview-img');
                    img.src = evt.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('preview-image-placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('card-title').addEventListener('input', (e) => {
            document.getElementById('preview-headline').innerText = e.target.value || 'Headline preview';
        });
        document.getElementById('display-link').addEventListener('input', (e) => {
            document.getElementById('preview-display-link').innerText = e.target.value || 'facebook.com';
        });
        document.getElementById('cta-type').addEventListener('change', (e) => {
            document.getElementById('preview-cta-btn').innerText = e.target.value;
        });
        document.getElementById('page-select').addEventListener('change', (e) => {
            const selectedText = e.target.options[e.target.selectedIndex].text;
            document.getElementById('preview-page-name').innerText = selectedText.split(' (')[0];
            document.getElementById('preview-page-id').innerText = e.target.value;
        });

        document.getElementById('publish-btn').addEventListener('click', async () => {
            const statusBar = document.getElementById('status-bar');
            statusBar.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700');
            statusBar.className = 'p-3 rounded-lg text-xs font-medium bg-blue-50 text-blue-700 text-center';
            statusBar.innerText = 'Publishing post to Facebook...';

            const formData = new FormData();
            formData.append('accessToken', document.getElementById('sync-token').value.trim());
            formData.append('pageId', document.getElementById('page-select').value);
            formData.append('message', document.getElementById('primary-text').value);
            formData.append('link', document.getElementById('website-url').value);
            formData.append('ctaType', document.getElementById('cta-type').value);
            formData.append('cardTitle', document.getElementById('card-title').value);
            formData.append('displayLink', document.getElementById('display-link').value);
            formData.append('displayDescription', document.getElementById('display-desc').value);

            const imageFileInput = document.getElementById('image-file');
            if (imageFileInput.files[0]) {
                formData.append('imageFile', imageFileInput.files[0]);
            }

            try {
                const res = await fetch('/api/facebook-publisher', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    statusBar.className = 'p-3 rounded-lg text-xs font-medium bg-emerald-100 text-emerald-700 text-center';
                    statusBar.innerText = `Success! Post published. ID: ${data.postId}`;
                } else {
                    statusBar.className = 'p-3 rounded-lg text-xs font-medium bg-red-100 text-red-700 text-center';
                    statusBar.innerText = `Error: ${data.error}`;
                }
            } catch (err) {
                statusBar.className = 'p-3 rounded-lg text-xs font-medium bg-red-100 text-red-700 text-center';
                statusBar.innerText = `Network Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
