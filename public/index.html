<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Ad Publisher</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center p-4">

    <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <!-- Left Sidebar Controls -->
        <div class="md:col-span-5 bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
            
            <!-- Connected User Profile Box -->
            <div id="profile-box" class="flex items-center space-x-3 p-3 bg-slate-50 rounded-lg border border-slate-100">
                <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-10 h-10 rounded-full object-cover border" alt="Avatar">
                <div>
                    <h4 id="user-name" class="font-semibold text-sm text-slate-700">Elaine Sefra Sandoval</h4>
                    <p id="user-id" class="text-xs text-slate-400">100073165332635</p>
                </div>
            </div>

            <!-- Facebook Pages -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Facebook Pages</label>
                <select id="page-select" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="1213616310596046">Marites Diaries (1213616310596046)</option>
                </select>
            </div>

            <!-- Ad Accounts -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Ad Accounts</label>
                <select id="adaccount-select" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="9346050792090257">9346050792090257</option>
                </select>
            </div>

            <!-- Primary Text -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Primary text</label>
                <textarea id="primary-text" rows="3" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="What's on your mind?"></textarea>
            </div>

            <!-- Upload Image -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Upload Image</label>
                <input type="file" id="image-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-lg p-1">
            </div>

            <!-- Card Buttons -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Card Buttons</label>
                <select id="cta-type" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="No Button">No Button</option>
                    <option value="Like Page">Like Page</option>
                    <option value="Learn More" selected>Learn More</option>
                    <option value="Shop Now">Shop Now</option>
                    <option value="Join Group">Join Group</option>
                    <option value="Book Travel">Book Travel</option>
                    <option value="Contact Us">Contact Us</option>
                </select>
            </div>

            <!-- Card 1 title (Headline) -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Card 1 title</label>
                <input type="text" id="card-title" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Write a short headline">
            </div>

            <!-- Website Url -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Website Url</label>
                <input type="text" id="website-url" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="http://www.example.com/page">
            </div>

            <!-- Show display link -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Show display link (Basic +)</label>
                <input type="text" id="display-link" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="facebook.com">
            </div>

            <!-- Description -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Put display link description (Basic +)</label>
                <input type="text" id="display-desc" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Description">
            </div>

        </div>

        <!-- Right Live Preview & Publish Area -->
        <div class="md:col-span-7 space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between h-full min-h-[550px]">
                
                <!-- Preview Header & Publish Button -->
                <div class="flex items-center justify-between border-b pb-3">
                    <div class="flex items-center space-x-3">
                        <img id="preview-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-9 h-9 rounded-full object-cover border" alt="Page Avatar">
                        <div>
                            <h5 id="preview-page-name" class="font-semibold text-xs text-slate-800">Marites Diaries</h5>
                            <span id="preview-page-id" class="text-[10px] text-slate-400">1213616310596046</span>
                        </div>
                    </div>
                    <button id="publish-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2 rounded-lg text-sm shadow transition">PUBLISH</button>
                </div>

                <!-- Preview Card Box -->
                <div class="border-2 border-blue-400 rounded-xl overflow-hidden my-auto bg-slate-50 flex flex-col">
                    <div id="preview-image-container" class="h-64 bg-slate-200 flex items-center justify-center text-slate-400 text-sm overflow-hidden relative">
                        <span id="preview-image-placeholder">Ad Creative Preview Area</span>
                        <img id="preview-img" class="w-full h-full object-cover hidden" alt="Preview">
                    </div>
                    <div class="p-3 bg-white border-t flex items-center justify-between">
                        <div>
                            <span id="preview-display-link" class="text-xs text-slate-400 block">facebook.com</span>
                            <h4 id="preview-headline" class="font-semibold text-sm text-slate-800">Headline preview</h4>
                        </div>
                        <button id="preview-cta-btn" class="bg-slate-100 border border-slate-200 text-slate-700 px-4 py-1.5 rounded text-xs font-medium">Learn More</button>
                    </div>
                </div>

                <!-- Status Feedback Bar -->
                <div id="status-bar" class="hidden p-3 rounded-lg text-xs font-medium"></div>

            </div>
        </div>

    </div>

    <!-- Hidden Extension Data Sync Helper -->
    <div class="w-full max-w-6xl mt-6 p-4 bg-white rounded-xl border border-slate-200 text-xs text-slate-500">
        <details>
            <summary class="cursor-pointer font-semibold text-slate-600">Extension Synced Data (Hidden)</summary>
            <div class="mt-2 grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium mb-1">Access Token:</label>
                    <input type="text" id="sync-token" class="w-full p-2 border rounded bg-slate-50" value="EAABsbCS1iHgBSOfkwZC37MUnKb7RYg5JQQ2qrWZAjCZAKIXca">
                </div>
                <div>
                    <label class="block font-medium mb-1">Cookie Data:</label>
                    <input type="text" id="sync-cookie" class="w-full p-2 border rounded bg-slate-50" value="c_user=100023525146491;">
                </div>
            </div>
        </details>
    </div>

    <script>
        // Image preview handler
        document.getElementById('image-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('preview-img');
                    img.src = evt.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('preview-image-placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Live text sync
        document.getElementById('card-title').addEventListener('input', (e) => {
            document.getElementById('preview-headline').innerText = e.target.value || 'Headline preview';
        });
        document.getElementById('display-link').addEventListener('input', (e) => {
            document.getElementById('preview-display-link').innerText = e.target.value || 'facebook.com';
        });
        document.getElementById('cta-type').addEventListener('change', (e) => {
            document.getElementById('preview-cta-btn').innerText = e.target.value;
        });

        // Publish action
        document.getElementById('publish-btn').addEventListener('click', async () => {
            const statusBar = document.getElementById('status-bar');
            statusBar.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700');
            statusBar.className = 'p-3 rounded-lg text-xs font-medium bg-blue-50 text-blue-700';
            statusBar.innerText = 'Publishing post to Facebook...';

            const formData = new FormData();
            formData.append('accessToken', document.getElementById('sync-token').value.trim());
            formData.append('pageId', document.getElementById('page-select').value);
            formData.append('message', document.getElementById('primary-text').value);
            formData.append('link', document.getElementById('website-url').value);
            formData.append('ctaType', document.getElementById('cta-type').value);
            formData.append('cardTitle', document.getElementById('card-title').value);
            formData.append('displayLink', document.getElementById('display-link').value);
            formData.append('displayDescription', document.getElementById('display-desc').value);

            const imageFileInput = document.getElementById('image-file');
            if (imageFileInput.files[0]) {
                formData.append('imageFile', imageFileInput.files[0]);
            }

            try {
                const res = await fetch('/api/facebook-publisher', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    statusBar.className = 'p-3 rounded-lg text-xs font-medium bg-emerald-100 text-emerald-700';
                    statusBar.innerText = `Success! Post ID: ${data.postId}`;
                } else {
                    statusBar.className = 'p-3 rounded-lg text-xs font-medium bg-red-100 text-red-700';
                    statusBar.innerText = `Error: ${data.error}`;
                }
            } catch (err) {
                statusBar.className = 'p-3 rounded-lg text-xs font-medium bg-red-100 text-red-700';
                statusBar.innerText = `Network Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
