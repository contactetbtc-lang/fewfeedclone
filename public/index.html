<script>
    let isFetchingAccount = false;

    // Direct Graph API Client Fallback to fetch Profile & Pages
    async function loadAccountInfo(token, cookie, targetPageId) {
        if (!token || isFetchingAccount) return;
        isFetchingAccount = true;

        const profileNameEl = document.getElementById('profileName');
        const profileStatusEl = document.getElementById('profileStatus');
        const profilePicEl = document.getElementById('profilePic');
        const pageSelect = document.getElementById('pageId');

        profileNameEl.textContent = 'Loading profile...';
        profileStatusEl.textContent = 'Fetching account details...';
        profileStatusEl.style.color = '#1877f2';

        let userProfile = null;
        let pagesList = [];

        // 1. Try fetching via Vercel Backend API route first
        try {
            const infoRes = await fetch('/api/account-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessToken: token, cookieData: cookie })
            });
            const accountData = await infoRes.json();
            if (accountData.profile) userProfile = accountData.profile;
            if (accountData.pages && accountData.pages.length > 0) pagesList = accountData.pages;
        } catch (err) {
            console.warn('Backend API fetch skipped/failed, trying direct Graph API...', err);
        }

        // 2. Direct Graph API Fallback for Profile
        if (!userProfile) {
            try {
                const profileRes = await fetch(`https://graph.facebook.com/v19.0/me?fields=id,name,picture.type(large)&access_token=${token}`);
                const profileData = await profileRes.json();
                if (profileData.name) {
                    userProfile = {
                        name: profileData.name,
                        picture: profileData.picture
                    };
                }
            } catch (err) {
                console.error('Direct Graph API profile error:', err);
            }
        }

        // Update Profile Header UI
        if (userProfile) {
            profileNameEl.textContent = userProfile.name;
            profileStatusEl.textContent = '✔ Account Connected';
            profileStatusEl.style.color = '#42b72a';
            if (userProfile.picture?.data?.url) {
                profilePicEl.src = userProfile.picture.data.url;
            }
        } else {
            profileNameEl.textContent = 'Connected Facebook User';
            profileStatusEl.textContent = '✔ Token Active';
            profileStatusEl.style.color = '#42b72a';
        }

        // 3. Direct Graph API Fallback for Pages
        if (pagesList.length === 0) {
            try {
                const pagesRes = await fetch(`https://graph.facebook.com/v19.0/me/accounts?fields=id,name,access_token&access_token=${token}`);
                const pagesData = await pagesRes.json();
                if (pagesData.data && pagesData.data.length > 0) {
                    pagesList = pagesData.data;
                }
            } catch (err) {
                console.error('Direct Graph API pages error:', err);
            }
        }

        // Populate Pages Dropdown UI
        pageSelect.innerHTML = '';
        if (pagesList.length > 0) {
            pagesList.forEach(page => {
                const option = document.createElement('option');
                option.value = page.id;
                option.textContent = `${page.name} (${page.id})`;
                if (targetPageId && page.id === targetPageId) option.selected = true;
                pageSelect.appendChild(option);
            });
        } else {
            pageSelect.innerHTML = '<option value="">No pages found for this token</option>';
        }

        isFetchingAccount = false;
    }

    // Handshake function called by Extension
    window.fetchAccountInfoFromExtension = function(token, cookie, targetPageId) {
        if (token) document.getElementById('accessToken').value = token;
        if (cookie) document.getElementById('cookieData').value = cookie;
        loadAccountInfo(token, cookie, targetPageId);
    };

    // Auto-trigger when access token is populated
    document.getElementById('accessToken').addEventListener('input', (e) => {
        const token = e.target.value.trim();
        const cookie = document.getElementById('cookieData').value.trim();
        if (token.length > 20) {
            loadAccountInfo(token, cookie);
        }
    });

    // Handle Form Submit
    document.getElementById('publishForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const logOutput = document.getElementById('logOutput');
        
        submitBtn.disabled = true;
        submitBtn.innerText = 'Publishing...';
        logOutput.style.display = 'block';
        logOutput.textContent = '🚀 Submitting publish request...\n';

        const formData = new FormData(e.target);

        try {
            const response = await fetch('/publish', {
                method: 'POST',
                body: formData
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                logOutput.textContent += decoder.decode(value);
                logOutput.scrollTop = logOutput.scrollHeight;
            }
        } catch (error) {
            logOutput.textContent += '\n💥 Request failed: ' + error.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Publish Post';
        }
    });
</script>
